name: "TerraMatrix"
description: "TerraMatrix edge runtime: connects Home Assistant to TerraMatrix and keeps working when the internet does not"
version: "2.0.1"
slug: "terramatrix"
url: "https://github.com/terramatrix-io/terramatrix-ha-addons"
image: "ghcr.io/terramatrix-io/terramatrix-ha-addon-{arch}"
# armv7 dropped in 2.0.0: Node 22 on 32-bit ARM is unreliable and caps near 3GB.
arch:
  - amd64
  - aarch64
init: false
homeassistant: "2024.1.0"
ingress: true
ingress_port: 8099
panel_icon: "mdi:view-dashboard"
panel_title: "TerraMatrix"
homeassistant_api: true
auth_api: true
hassio_api: true
hassio_role: "default"
options:
  node_id: ""
  enrollment_token: ""
  cloud_url: ""
  cloud_socket_path: "/socket.io"
  ha_url: ""
  ha_token: ""
  log_level: "info"
schema:
  node_id: "str"
  enrollment_token: "password?"
  cloud_url: "str?"
  cloud_socket_path: "str"
  # Only needed when Home Assistant runs on a DIFFERENT box than this add-on.
  ha_url: "str?"
  ha_token: "password?"
  log_level: "list(trace|debug|info|warning|error)"
ports:
  "8099/tcp": null
ports_description:
  "8099/tcp": "Web interface (handled by ingress)"
map:
  - config:ro
